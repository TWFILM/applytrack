# Local development database only. Production uses Neon.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack
      POSTGRES_DB: applytrack
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrack -d applytrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
